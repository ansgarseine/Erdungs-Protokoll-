<style>
:root {
--primary: #2563eb;
--primary-dark: #1d4ed8;
--bg-color: #f8fafc;
--card-bg: #ffffff;
--text-color: #1e293b;
--border-color: #cbd5e1;
--danger: #ef4444;
--success: #22c55e;
}
body {
font-family: system-ui, -apple-system, sans-serif, Arial; background-color: var(--bg-color);
color: var(--text-color);
margin: 0;
padding: 10px;
line-height: 1.5;
}
.container {
max-width: 600px;
margin: 0 auto;
background: var(--card-bg);
padding: 20px;
border-radius: 12px;
box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
h1 {
font-size: 1.3rem;
text-align: center;
color: var(--primary);
margin-bottom: 20px;
}
fieldset {
border: 1px solid var(--border-color); border-radius: 8px;
padding: 15px; margin-bottom: 15px; background: #fff;
}
legend {
font-weight: bold; color: var(--primary); padding: 0 5px;
}
.form-group {
margin-bottom: 12px;
}
.form-row {
display: flex;
gap: 10px;
}
.form-row .form-group {flex: 1;
}
label {
display: block;
font-weight: 600;
font-size: 0.9rem;
margin-bottom: 5px;
}
input[type="text"], input[type="date"], input[type="number"], select, textarea { width: 100%;
padding: 10px;
border: 1px solid var(--border-color); border-radius: 6px;
box-sizing: border-box;
font-size: 1rem;
}
.checkbox-list {
display: flex;
flex-direction: column;
gap: 8px;
margin-top: 8px;
}
.checkbox-item {
display: flex;
align-items: center;
gap: 10px;
font-weight: normal;
}
.checkbox-item input {
width: 20px;
height: 20px;
}
.custom-photo-btn {
display: flex;
align-items: center;
justify-content: center;
width: 100%;
background-color: #2c3e50;
color: white;
padding: 12px;
border-radius: 8px;
font-weight: bold;
font-size: 0.95rem;
cursor: pointer;
margin-top: 8px;
text-align: center;
box-sizing: border-box;
}
.custom-photo-btn input[type="file"] { display: none;
}
.btn-group {
display: flex;
flex-direction: column; gap: 10px;
margin-top: 20px;}
button {
background-color: var(--primary);
color: white;
border: none;
padding: 12px;
border-radius: 6px;
font-size: 1rem;
font-weight: bold;
cursor: pointer;
transition: background 0.2s;
}
button:hover { opacity: 0.9; }
button.btn-success { background-color: var(--success); } button.btn-secondary { background-color: #64748b; } button.btn-danger { background-color: var(--danger); }
.photo-preview {
display: flex;
flex-wrap: wrap;
gap: 10px;
margin-top: 10px;
justify-content: center;
}
.photo-thumb {
position: relative;
width: 80px;
height: 80px;
border-radius: 4px;
overflow: hidden;
border: 1px solid var(--border-color); }
.photo-thumb img {
width: 100%;
height: 100%;
object-fit: cover;
}
.photo-thumb button.delete-photo { position: absolute;
top: 2px;
right: 2px;
background: rgba(239, 68, 68, 0.85); color: white;
border: none; border-radius: 50%; width: 20px;
height: 20px;
font-size: 12px; cursor: pointer; display: flex;
align-items: center; justify-content: center; padding: 0;
}
</style> </head><body>
<div class="container">
<h1>Protokoll über Erstellung der Erdungsanlage</h1>
<form id="erdungsForm">
<!-- 1. Stammdaten -->
<fieldset>
<legend>■ Stammdaten</legend>
<div class="form-group">
<label for="datum">Datum</label>
<input type="date" id="datum" required>
</div>
<div class="form-group">
<label for="auftragsnummer">Auftragsnummer</label>
<input type="text" id="auftragsnummer" placeholder="z.B. 2026-991">
</div>
<div class="form-group">
<label for="monteur">Monteur</label>
<input type="text" id="monteur" required placeholder="Name">
</div>
<div class="form-group">
<label for="strasse">Straße & Hausnummer</label>
<input type="text" id="strasse" required placeholder="Musterstraße 12">
</div>
<div class="form-row">
<div class="form-group">
<label for="plz">PLZ</label>
<input type="text" id="plz" required placeholder="69115">
</div>
<div class="form-group">
<label for="stadt">Stadt</label>
<input type="text" id="stadt" required placeholder="Heidelberg">
</div>
</div>
</fieldset>
<fieldset>
<legend>Erderprüfung</legend>
<div class="form-group">
<label for="ohmWert">Gemessener Erdungswiderstand (&Omega;):</label>
<input type="number" step="0.01" id="ohmWert" placeholder="z. B. 0.5">
</div>
<label class="custom-photo-btn">
■ Fotos: Erder & Messwerte (<span id="count_derder">0</span>)
<input type="file" accept="image/*" capture="environment" onchange="handlePhoto(event, 'previewErder', 'derder', 'count_derder')">
</label>
<div id="previewErder" class="photo-preview"></div> </fieldset>
<fieldset>
<legend>Potenzialausgleich</legend> <div class="form-group">
<label>Was wurde geerdet?</label> <div class="checkbox-list"><label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Zählerschrank"> Zählerschrank</label>
<label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Hausanschlusskasten">
Hausanschlusskasten</label>
<label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Gas"> Gas</label>
<label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Wasser"> Wasser</label>
<label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Heizung"> Heizung</label>
<label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Kabelrinne"> Kabelrinne</label>
</div>
</div>
<div class="form-group" style="margin-top: 10px;">
<label for="paDetails">Zusätzliche Details:</label>
<textarea id="paDetails" rows="2" placeholder="Optionale Anmerkungen..."></textarea>
</div>
<label class="custom-photo-btn">
■ Fotos: Potenzialausgleich (<span id="count_dpa">0</span>)
<input type="file" accept="image/*" capture="environment" onchange="handlePhoto(event, 'previewPA', 'dpa', 'count_dpa')">
</label>
<div id="previewPA" class="photo-preview"></div>
</fieldset>
<fieldset>
<legend>■ Anlagen-Fotos (Pflicht)&</legend>
<label class="custom-photo-btn">
■ Fotos: Zähleranlagen ( <span id="count_dzaehler">0</span> )
<input type="file" accept="image/*" capture="environment" onchange="handlePhoto(event, 'previewZaehler', 'dzaehler',
'count_dzaehler')">
</label>
<label class="custom-photo-btn">
■ Fotos: Hausanschlusskasten (HAK) ( <span id="count_dhak">0</span> )
<input type="file" accept="image/*" capture="environment" onchange="handlePhoto(event, 'previewHAK', 'dhak', 'count_dhak')"> </label>
<div id="previewHAK" class="photo-preview"></div>
</fieldset>
<fieldset>
<legend>■ Abschluss, Export & Aktion</legend>
<div class="btn-group">
<button type="button" onclick="showSummary()">■ Zusammenfassung anzeigen</button>
<button type="button" class="btn-success" onclick="generatePDF()">■ PDF-Bericht erstellen & herunterladen</button> <button type="button" class="btn-secondary" onclick="downloadAllPhotos()">■ Alle Fotos einzeln herunterladen</button> <button type="button" class="btn-danger" onclick="clearForm()">■■ Formular vollständig leeren (Reset)</button>
</div>
</fieldset>
</form>
<script>
const photosData = { derder: [], dpa: [], dzaehler: [], dhak: [] };
function sanitizeFilename(str) {
return str ? str.replace(/[^a-zA-Z0-9äöüÄÖÜß\-_]/g, '_').substring(0, 30) : ''; }
function handlePhoto(event, previewId, storageKey, countId) { const files = event.target.files;
if (!files || files.length === 0) return;const strasse = document.getElementById('strasse').value.trim();
const stadt = document.getElementById('stadt').value.trim();
const watermarkText = (strasse && stadt ? strasse + ", " + stadt : strasse || 'Objekt') + " | " + new Date().toLocaleString('de-DE');
for (let file of files) {
const reader = new FileReader();
reader.onload = function(e) {
const img = new Image();
img.onload = function() {
const canvas = document.createElement('canvas');
canvas.width = img.width; canvas.height = img.height;
const ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0);
const fontSize = Math.max(16, Math.floor(canvas.height / 35));
ctx.font = "bold " + fontSize + "px sans-serif";
ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
ctx.fillRect(0, canvas.height - (fontSize + 20), ctx.measureText(watermarkText).width + 20, fontSize + 20);
ctx.fillStyle = '#ffffff';
ctx.fillText(watermarkText, 10, canvas.height - 12);
photosData[storageKey].push({ name: file.name, data: canvas.toDataURL('image/jpeg', 0.85), width: img.width, height:
img.height });
renderPreviews(storageKey, previewId, countId);
};
img.src = e.target.result;
};
reader.readAsDataURL(file);
}
}
function renderPreviews(storageKey, previewId, countId) {
const container = document.getElementById(previewId);
container.innerHTML = '';
document.getElementById(countId).innerText = photosData[storageKey].length;
photosData[storageKey].forEach((photo, idx) => {
const thumb = document.createElement('div');
thumb.className = 'photo-thumb';
const img = document.createElement('img'); img.src = photo.data;
const btn = document.createElement('button'); btn.className = 'delete-photo'; btn.innerHTML = '×'; btn.onclick = () => { photosData[storageKey].splice(idx, 1); renderPreviews(storageKey, previewId, countId); }; thumb.appendChild(img); thumb.appendChild(btn); container.appendChild(thumb);
});
}
function showSummary() {
const selectedPA = Array.from(document.querySelectorAll('input[name="pa_ziel"]:checked')).map(cb => cb.value).join(', ') ||
'Keine Auswahl';
alert("--- PROTOKOLL-ZUSAMMENFASSUNG ---\n\nMonteur: " + document.getElementById('monteur').value + "\nAdresse: " + document.getElementById('strasse').value + "\nWiderstand: " + (document.getElementById('ohmWert').value || '-') + "
Ohm\nPotentialausgleich: " + selectedPA);
}
function downloadAllPhotos() {
let count = 0;
['derder', 'dpa', 'dzaehler', 'dhak'].forEach(key => { photosData[key].forEach((p, i) => {count++;
const a = document.createElement('a'); a.href = p.data; a.download = `Foto_${key}_${i+1}.jpg`; a.click();
});
});
if(!count) alert('Keine Fotos vorhanden.');
}
function generatePDF() {
const { jsPDF } = window.jspdf;
const doc = new jsPDF();
let y = 15;
doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(37, 99, 235);
doc.text("ELEKTRO", 195, y, { align: 'right' });
doc.text("Fachbetrieb", 195, y + 5, { align: 'right' });
doc.setFontSize(11); doc.setFont(undefined, 'normal'); doc.setTextColor(30, 41, 59);
doc.text("Jordine GBP GmbH", 195, y + 11, { align: 'right' });
y += 18;
doc.setFontSize(15); doc.setFont(undefined, 'bold'); doc.text("Protokoll über Erstellung der Erdungsanlage", 15, y); y += 4; doc.setDrawColor(37, 99, 235); doc.line(15, y, 195, y);
y += 10; doc.setFontSize(10); doc.setFont(undefined, 'bold'); doc.text("Stammdaten", 15, y);
y += 6; doc.setFont(undefined, 'normal');
doc.text("Datum: " + document.getElementById('datum').value, 15, y); y += 6;
doc.text("Monteur: " + document.getElementById('monteur').value, 15, y); y += 6;
doc.text("Adresse: " + document.getElementById('strasse').value, 15, y); y += 10;
doc.setFont(undefined, 'bold'); doc.text("Erder-Prüfung", 15, y);
y += 6; doc.setFont(undefined, 'normal');
doc.text("Erdungswiderstand: " + (document.getElementById('ohmWert').value || '-') + " Ohm", 15, y); y += 12;
function addPhotosToPdf(title, photos) {
if (!photos.length) return;
if (y > 220) { doc.addPage(); y = 20; }
doc.setFont(undefined, 'bold'); doc.text(title, 15, y); y += 8;
photos.forEach(p => {
let w = 75, h = (p.height / p.width) * w;
if (h > 55) { h = 55; w = (p.width / p.height) * h; }
if (y + h > 260) { doc.addPage(); y = 20; }
doc.addImage(p.data, 'JPEG', 15, y, w, h); y += h + 6;
});
}
addPhotosToPdf("Fotos: Erder & Messwerte", photosData.derder);
addPhotosToPdf("Fotos: Potenzialausgleich", photosData.dpa);
addPhotosToPdf("Fotos: Zähleranlagen", photosData.dzaehler);
addPhotosToPdf("Fotos: Hausanschlusskasten (HAK)", photosData.dhak);
for (let i = 1; i <= doc.internal.getNumberOfPages(); i++) {
doc.setPage(i); doc.setFontSize(8); doc.setTextColor(100);
doc.line(15, 278, 195, 278);
doc.text("Erstellt durch ABA Erdungscheck-System", 15, 283);
doc.text("Elektro Fachbetrieb Jordine | GBP | GmbH - Mannheim", 15, 290);
}
doc.save("Erdungsprotokoll_" + sanitizeFilename(document.getElementById('strasse').value) + ".pdf");}
</script> </body> </html>
